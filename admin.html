<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>3CE 问卷数据后台</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="admin-body">
    <main class="admin-shell">
      <header class="admin-header">
        <div><strong>3CE</strong><span>问卷数据管理后台</span></div>
        <button id="logout" class="text-button" hidden>退出</button>
      </header>

      <section class="login-card" id="login-card">
        <p>ADMIN ACCESS</p>
        <h1>查看问卷结果</h1>
        <form id="login">
          <label>管理员密码<input id="password" type="password" autocomplete="current-password" required /></label>
          <button class="primary" type="submit">进入后台</button>
        </form>
        <div class="notice" id="login-notice"></div>
      </section>

      <section class="dashboard hidden" id="dashboard">
        <div class="admin-title">
          <div><p>DATA OVERVIEW</p><h1>匿名问卷分析</h1></div>
          <button class="primary small" id="export">导出 CSV</button>
        </div>
        <div class="stat-grid" id="stats"></div>
        <div class="analysis-grid" id="charts"></div>
        <section class="table-card">
          <div class="table-title"><h2>答卷明细</h2><span id="count"></span></div>
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th>提交时间</th>
                  <th>版本</th>
                  <th>年龄</th>
                  <th>所在城市</th>
                  <th>3CE了解程度</th>
                  <th>韩系内容关注度</th>
                  <th>化妆价值</th>
                  <th>品牌陪伴期待</th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>
    <script type="module" src="/admin.js"></script>
  </body>
</html>
